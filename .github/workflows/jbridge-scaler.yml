name: jBridge Scaler EXE

on:
  push:
    branches: [ feature/jbridge-gui-scaler ]
    paths:
      - 'src/jbridge_probe/**'
      - '.github/workflows/jbridge-scaler.yml'
      - 'tests/jbridge_gui_mock.cpp'
      - 'tests/jbridge_native_dpi_feasibility.cpp'
  workflow_dispatch:

jobs:
  scaler:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure viewer only
        shell: pwsh
        run: |
          cmake -S . -B build-viewer -A x64 -DPLUGINSCALER_FETCH_VST3_SDK=OFF -DPLUGINSCALER_BUILD_TESTS=OFF
      - name: Build viewer
        run: cmake --build build-viewer --config Release --target PluginScalerJBridgeViewer
      - name: Build input fixture
        run: cmake --build build-viewer --config Release --target PluginScalerJBridgeMockGUI
      - name: Run real input fixture
        shell: pwsh
        run: |
          & "build-viewer/src/jbridge_probe/Release/PluginScalerJBridgeMockGUI.exe"
          if ($LASTEXITCODE -ne 0) { throw "Win32 mouse fixture failed (desktop input may be unavailable on hosted runner)" }
      - name: Native DPI feasibility (isolated)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dev = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$dev`" -arch=x64 && cl /nologo /EHsc /std:c++20 /Fe:NativeDpiProbe.exe tests\jbridge_native_dpi_feasibility.cpp user32.lib"
          if ($LASTEXITCODE -ne 0) { throw "DPI feasibility compile failed" }
          & .\NativeDpiProbe.exe
          if ($LASTEXITCODE -eq 42) {
            Write-Warning "NATIVE 150% DPI TEST INCONCLUSIVE: CI runner is 96 DPI; this is NOT a scaling PASS."
          } elseif ($LASTEXITCODE -ne 0) {
            throw "DPI feasibility failed with exit code $LASTEXITCODE"
          }
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build-viewer/src/jbridge_probe/Release/PluginScalerJBridgeViewer.exe"
          if (-not (Test-Path $exe)) { throw "Viewer EXE missing" }
          Write-Host "standalone-viewer-build=PASS"
      - name: Upload only the EXE
        uses: actions/upload-artifact@v4
        with:
          name: PluginScalerJBridgeViewer
          path: build-viewer/src/jbridge_probe/Release/PluginScalerJBridgeViewer.exe
          retention-days: 14
          if-no-files-found: error
