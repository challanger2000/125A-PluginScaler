name: VST3 Window Scaler prototype

on:
  push:
    branches:
      - feature/vst3-window-scaler-20261116
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build x64 release
        run: cmake --build build --config Release --parallel
      - name: Run deterministic geometry tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Regression guard — original must remain visible
        shell: pwsh
        run: python tests/source_visibility_guard.py
      - name: Real Windows magnification pixel smoke (mock editor)
        shell: pwsh
        run: |
          & build/Release/PluginScalerCaptureSmoke.exe
          $code = $LASTEXITCODE
          if ($code -eq 77) {
            Write-Warning "VISUAL_INCONCLUSIVE: hosted Windows runner has no readable interactive desktop. No visual PASS claimed."
          } elseif ($code -ne 0) {
            throw "VISUAL_FAIL: capture smoke exited $code"
          } else {
            Write-Host "VISUAL_PASS: capture compared against source-window pixels"
          }
      - name: Package for manual Windows VST3 testing
        shell: pwsh
        run: |
          New-Item -Type Directory -Force -Path package | Out-Null
          Copy-Item build/Release/PluginScalerVST3Window.exe package/
          Copy-Item docs/VST3-MANUAL-TEST-DE.md package/START-HERE.txt
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: 125A-VST3-WindowScaler-Prototyp
          path: package/*
          if-no-files-found: error
          retention-days: 14
