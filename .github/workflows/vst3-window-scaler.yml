name: VST3 Window Scaler prototype

on:
  push:
    branches:
      - feature/vst3-window-scaler-20261116
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build x64 release
        run: cmake --build build --config Release --parallel
      - name: Run deterministic geometry tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Regression guard — original must remain visible
        shell: pwsh
        run: python tests/source_visibility_guard.py
      - name: Real Windows magnification pixel smoke (mock editor)
        shell: pwsh
        run: |
          & build/Release/PluginScalerCaptureSmoke.exe
          $code = $LASTEXITCODE
          if ($code -eq 77) {
            Write-Warning "VISUAL_INCONCLUSIVE: hosted Windows runner has no readable interactive desktop. No visual PASS claimed."
          } elseif ($code -ne 0) {
            throw "VISUAL_FAIL: capture smoke exited $code"
          } else {
            Write-Host "VISUAL_PASS: capture compared against source-window pixels"
          }
      - name: Genuine VST2 DLL GUI + Scaler visual integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dll = (Resolve-Path "build/Release/PluginScalerVST2Fixture.dll").Path
          $hostExe = (Resolve-Path "build/Release/PluginScalerVST2Host.exe").Path
          $smokeExe = (Resolve-Path "build/Release/PluginScalerRealVST3Smoke.exe").Path
          $out = Join-Path (Get-Location) "vst2-host-stdout.txt"
          $err = Join-Path (Get-Location) "vst2-host-stderr.txt"
          $proc = Start-Process -FilePath $hostExe -ArgumentList @(('"' + $dll + '"')) -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            & $smokeExe --vst2
            $code = $LASTEXITCODE
            if ($code -eq 77) {
              Write-Warning "VST2_VISUAL_INCONCLUSIVE: desktop unavailable; cannot claim real image PASS"
            } elseif ($code -ne 0) {
              throw "VST2_VISUAL_FAIL: scaled pixels differ or GUI could not open, exit=$code"
            } else {
              Write-Host "VST2_VISUAL_PASS: actual native VST2 DLL editor was magnified"
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $out) { Get-Content $out }
            if (Test-Path $err) { Get-Content $err }
          }
      - name: Genuine VST2 OS mouse-to-parameter positive-control
        shell: pwsh
        run: |
          $dll = (Resolve-Path "build/Release/PluginScalerVST2Fixture.dll").Path
          $hostExe = (Resolve-Path "build/Release/PluginScalerVST2Host.exe").Path
          $smokeExe = (Resolve-Path "build/Release/PluginScalerRealVST3Smoke.exe").Path
          $out = Join-Path (Get-Location) "vst2-mouse-host-out.txt"
          $err = Join-Path (Get-Location) "vst2-mouse-host-err.txt"
          $proc = Start-Process -FilePath $hostExe -ArgumentList @(('"' + $dll + '"')) -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            & $smokeExe --vst2-input
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              throw "VST2 mouse input QA failed or inconclusive: exit=$code"
            }
            Write-Host "VST2_INTERACTION_PASS: real OS mouse through scaled viewer changes fixture VST2 parameter"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $out) { Get-Content $out }
            if (Test-Path $err) { Get-Content $err }
          }
      - name: Package for manual Windows VST3 testing
        shell: pwsh
        run: |
          New-Item -Type Directory -Force -Path package | Out-Null
          Copy-Item build/Release/PluginScalerVST3Window.exe package/
          Copy-Item build/Release/PluginScalerVST2Host.exe package/
          Copy-Item docs/VST3-MANUAL-TEST-DE.md package/START-HERE.txt
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: 125A-VST3-WindowScaler-Prototyp
          path: package/*
          if-no-files-found: error
          retention-days: 14

  real-125a-vst3-graphics:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout Scaler (under test)
        uses: actions/checkout@v4
      - name: Checkout original 125A Ugly Reverb (READ-ONLY)
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Ugly-Reverb-Final
          ref: 631c79b5fddfb19b916d927f0918134576a3a031
          path: uglyreverb
      - name: Checkout original 125A Test Lab (READ-ONLY)
        uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Plugin-Test-Lab
          ref: 7213fe1f81f4036f74431cb5b2d7dbd09b73ee5c
          path: testlab
      - name: Build original 125A Ugly Reverb VST3
        shell: pwsh
        run: |
          cmake -S uglyreverb -B ugly-build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Ugly Reverb configuration failed" }
          cmake --build ugly-build --config Release --target UglyReverb --parallel
          if ($LASTEXITCODE -ne 0) { throw "125A Ugly Reverb source VST3 build failed" }
      - name: Prepare isolated Test Lab hold-open mode (no product changes)
        shell: pwsh
        run: |
          python tests/patch_testlab_gui_hold.py testlab/src/gui_host.cpp
          if ($LASTEXITCODE -ne 0) { throw "Test Lab source anchor changed" }
      - name: Build actual 125A Test Lab native VST3 GUI host
        shell: pwsh
        run: |
          cmake -S testlab -B lab-build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Test Lab configuration failed" }
          cmake --build lab-build --config Release --target TestLabGUI --parallel
          if ($LASTEXITCODE -ne 0) { throw "Test Lab GUI host build failed" }
      - name: Build actual 125A Scaler visual verifier
        shell: pwsh
        run: |
          cmake -S . -B scaler-build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Scaler configure failed" }
          cmake --build scaler-build --config Release --target PluginScalerRealVST3Smoke --parallel
          if ($LASTEXITCODE -ne 0) { throw "Scaler visual test build failed" }
      - name: Open real 125A Ugly Reverb and compare magnified pixels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $plugin = Get-ChildItem "ugly-build" -Recurse -Directory -Filter "UglyReverb.vst3" | Select-Object -First 1
          $hostExe = Get-ChildItem "lab-build" -Recurse -File -Filter "125A_Test_Lab_GUI.exe" | Select-Object -First 1
          $smokeExe = Get-ChildItem "scaler-build" -Recurse -File -Filter "PluginScalerRealVST3Smoke.exe" | Select-Object -First 1
          if (-not $plugin -or -not $hostExe -or -not $smokeExe) { throw "Missing real product, real Test Lab GUI host or Scaler visual test" }
          Write-Host "REAL_125A_PLUGIN=$($plugin.FullName)"
          (Get-FileHash (Get-ChildItem $plugin.FullName -Recurse -File -Filter "*.vst3" | Select-Object -First 1).FullName -Algorithm SHA256) | Format-List
          $env:125A_SCALER_HOLD_MS = "25000"
          $stdout = Join-Path (Get-Location) "real-125a-host-stdout.txt"
          $stderr = Join-Path (Get-Location) "real-125a-host-stderr.txt"
          $bmp = Join-Path (Get-Location) "real-125a-host.bmp"
          $args = @("--snapshot-editor", ('"' + $plugin.FullName + '"'), ('"' + $bmp + '"'))
          $proc = Start-Process -FilePath $hostExe.FullName -ArgumentList $args -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            & $smokeExe.FullName
            $code = $LASTEXITCODE
            if ($code -eq 77) {
              Write-Warning "REAL_125A_VST3_INCONCLUSIVE: Windows capture was unavailable or Auto-Fit prevented genuine enlargement. Do not claim PASS."
            } elseif ($code -ne 0) {
              throw "REAL_125A_VST3_FAIL: magnifier image check exited $code"
            } else {
              Write-Host "REAL_125A_VST3_PASS: actual Ugly Reverb magnification observed"
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }
      - name: Upload real-product test host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Scaler-Real-UglyReverb-VST3-Evidence
          path: |
            real-125a-host-stdout.txt
            real-125a-host-stderr.txt
            real-125a-host.bmp
          if-no-files-found: warn
          retention-days: 7
