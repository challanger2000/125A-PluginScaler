name: Windows Bootstrap

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Select-Object -ExpandProperty Name

      - name: Configure
        run: >
          cmake -S . -B build
          -A ${{ matrix.arch }}
          -DPLUGINSCALER_FETCH_VST3_SDK=ON
          -DPLUGINSCALER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload jBridge window probe
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: 125A-jBridge-WindowProbe
          path: build/src/jbridge_probe/Release/PluginScalerJBridgeProbe.exe

      - name: Upload jBridge 150 geometry test
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: 125A-jBridge-150-GeometryTest
          path: build/src/jbridge_probe/Release/PluginScalerJBridge150.exe

      - name: Upload jBridge capture probe
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: 125A-jBridge-CaptureProbe
          path: build/src/jbridge_probe/Release/PluginScalerJBridgeCaptureProbe.exe

  cross-bitness-vst2:
    name: x64 proxy -> x86 VST2 helper
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32
        run: >
          cmake -S . -B build-x86
          -A Win32
          -DPLUGINSCALER_FETCH_VST3_SDK=OFF
          -DPLUGINSCALER_BUILD_TESTS=ON

      - name: Build Win32 helper and mock VST2
        run: cmake --build build-x86 --config Release --parallel

      - name: Configure x64
        run: >
          cmake -S . -B build-x64
          -A x64
          -DPLUGINSCALER_FETCH_VST3_SDK=OFF
          -DPLUGINSCALER_BUILD_TESTS=ON

      - name: Build x64 proxy and host harness
        run: >
          cmake --build build-x64 --config Release
          --target PluginScalerVST2Proxy PluginScalerVST2ProxyHost PluginScalerVST2SynthProxyHost PluginScalerVST2GdiProxyHost PluginScalerBridgeClient
          --parallel

      - name: Verify PE architectures
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }

          $proxyHost = "build-x64\tests\Release\PluginScalerVST2ProxyHost.exe"
          $proxy = "build-x64\src\proxy\vst2\Release\PluginScalerVST2Proxy.dll"
          $helper = "build-x86\src\helper\Release\PluginScalerHelper-x86.exe"
          $plugin = "build-x86\tests\Release\MockVST2.dll"

          foreach ($f in @($proxyHost, $proxy, $helper, $plugin)) {
            & $dumpbin.FullName /headers $f | Select-String "machine"
          }

          $hostHeader = (& $dumpbin.FullName /headers $proxyHost | Out-String)
          $proxyHeader = (& $dumpbin.FullName /headers $proxy | Out-String)
          $helperHeader = (& $dumpbin.FullName /headers $helper | Out-String)
          $pluginHeader = (& $dumpbin.FullName /headers $plugin | Out-String)

          if ($hostHeader -notmatch "8664 machine") { throw "Proxy host is not x64" }
          if ($proxyHeader -notmatch "8664 machine") { throw "VST2 proxy is not x64" }
          if ($helperHeader -notmatch "14C machine") { throw "Helper is not x86" }
          if ($pluginHeader -notmatch "14C machine") { throw "Mock VST2 is not x86" }

      - name: Run direct x64-to-x86 shared-memory bridge
        shell: pwsh
        run: |
          $client = Resolve-Path "build-x64\tests\Release\PluginScalerBridgeClient.exe"
          $helper = Resolve-Path "build-x86\src\helper\Release\PluginScalerHelper-x86.exe"
          $plugin = Resolve-Path "build-x86\tests\Release\MockVST2.dll"

          & $client $helper $plugin
          if ($LASTEXITCODE -ne 0) {
            throw "Cross-bitness shared-memory bridge failed with exit code $LASTEXITCODE"
          }

      - name: Run x64 VST2 proxy through x86 helper
        shell: pwsh
        run: |
          $proxyHostExe = Resolve-Path "build-x64\tests\Release\PluginScalerVST2ProxyHost.exe"
          $proxy = Resolve-Path "build-x64\src\proxy\vst2\Release\PluginScalerVST2Proxy.dll"
          $helper = Resolve-Path "build-x86\src\helper\Release\PluginScalerHelper-x86.exe"
          $plugin = Resolve-Path "build-x86\tests\Release\MockVST2.dll"
          $manifest = Join-Path $PWD "build-x86\MockVST2.pluginscaler.txt"

          & $helper --write-vst2-manifest $plugin $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "VST2 manifest generation failed with exit code $LASTEXITCODE"
          }

          $output = & $proxyHostExe $proxy $helper $plugin $manifest
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "End-to-end x64 VST2 proxy bridge failed with exit code $LASTEXITCODE"
          }
          $joined = ($output | Out-String)
          if ($joined -notmatch "metadata=PASS") {
            throw "Proxy metadata marker missing"
          }
          if ($joined -notmatch "parameter=PASS") {
            throw "Proxy parameter bridge marker missing"
          }
          if ($joined -notmatch "state=PASS") {
            throw "Proxy state/control bridge marker missing"
          }
          if ($joined -notmatch "helper-crash-isolation=PASS") {
            throw "Helper crash isolation marker missing"
          }
          if ($joined -notmatch "helper-recovery-offthread=PASS") {
            throw "Helper off-thread recovery marker missing"
          }
          if ($joined -notmatch "helper-restart-state=PASS") {
            throw "Helper restart state marker missing"
          }
          if ($joined -notmatch "helper-hang-isolation=PASS") {
            throw "Helper hang isolation marker missing"
          }
          if ($joined -notmatch "helper-hang-recovery=PASS") {
            throw "Helper hang recovery marker missing"
          }
          if ($joined -notmatch "torture=PASS") {
            throw "Proxy lifecycle torture marker missing"
          }

      - name: Run x64 proxy with non-chunk VST2 state fallback
        shell: pwsh
        run: |
          $proxyHostExe = Resolve-Path "build-x64\tests\Release\PluginScalerVST2ProxyHost.exe"
          $proxy = Resolve-Path "build-x64\src\proxy\vst2\Release\PluginScalerVST2Proxy.dll"
          $helper = Resolve-Path "build-x86\src\helper\Release\PluginScalerHelper-x86.exe"
          $plugin = Resolve-Path "build-x86\tests\Release\MockVST2NoChunk.dll"
          $manifest = Join-Path $PWD "build-x86\MockVST2NoChunk.pluginscaler.txt"

          & $helper --write-vst2-manifest $plugin $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "No-chunk manifest generation failed with exit code $LASTEXITCODE"
          }

          $manifestText = Get-Content $manifest
          $flagsLine = $manifestText | Where-Object { $_ -like "flags=*" } | Select-Object -First 1
          if (-not $flagsLine) {
            throw "No-chunk manifest flags missing"
          }
          $flags = [int]($flagsLine.Substring(6))
          if (($flags -band 32) -ne 0) {
            throw "No-chunk mock unexpectedly advertises program chunks"
          }

          $output = & $proxyHostExe $proxy $helper $plugin $manifest
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "No-chunk fallback bridge failed with exit code $LASTEXITCODE"
          }
          $joined = ($output | Out-String)
          foreach ($marker in @(
            "metadata=PASS",
            "parameter=PASS",
            "state=PASS",
            "helper-crash-isolation=PASS",
            "helper-restart-state=PASS",
            "torture=PASS"
          )) {
            if ($joined -notmatch [regex]::Escape($marker)) {
              throw "No-chunk fallback marker missing: $marker"
            }
          }
          Write-Host "fallback-state=PASS"

      - name: Run x64 proxy with legacy process-only VST2
        shell: pwsh
        run: |
          $proxyHostExe = Resolve-Path "build-x64\tests\Release\PluginScalerVST2ProxyHost.exe"
          $proxy = Resolve-Path "build-x64\src\proxy\vst2\Release\PluginScalerVST2Proxy.dll"
          $helper = Resolve-Path "build-x86\src\helper\Release\PluginScalerHelper-x86.exe"
          $plugin = Resolve-Path "build-x86\tests\Release\MockVST2LegacyProcess.dll"
          $manifest = Join-Path $PWD "build-x86\MockVST2LegacyProcess.pluginscaler.txt"

          & $helper --write-vst2-manifest $plugin $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "Legacy process-only manifest generation failed with exit code $LASTEXITCODE"
          }

          $output = & $proxyHostExe $proxy $helper $plugin $manifest
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Legacy process-only bridge failed with exit code $LASTEXITCODE"
          }
          $joined = ($output | Out-String)
          foreach ($marker in @(
            "metadata=PASS",
            "parameter=PASS",
            "state=PASS",
            "helper-hang-isolation=PASS",
            "helper-hang-recovery=PASS",
            "torture=PASS"
          )) {
            if ($joined -notmatch [regex]::Escape($marker)) {
              throw "Legacy process-only marker missing: $marker"
            }
          }
          Write-Host "legacy-process-fallback=PASS"

      - name: Run x64 proxy with x86 zero-input synth
        timeout-minutes: 3
        shell: pwsh
        run: |
          $synthHost = Resolve-Path "build-x64\tests\Release\PluginScalerVST2SynthProxyHost.exe"
          $proxy = Resolve-Path "build-x64\src\proxy\vst2\Release\PluginScalerVST2Proxy.dll"
          $helper = Resolve-Path "build-x86\src\helper\Release\PluginScalerHelper-x86.exe"
          $synth = Resolve-Path "build-x86\tests\Release\MockVST2Synth.dll"
          $manifest = Join-Path $PWD "build-x86\MockVST2Synth.pluginscaler.txt"

          & $helper --write-vst2-manifest $synth $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "Synth manifest generation failed with exit code $LASTEXITCODE"
          }

          $output = & $synthHost $proxy $helper $synth $manifest
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Zero-input synth bridge failed with exit code $LASTEXITCODE"
          }

          $joined = ($output | Out-String)
          if ($joined -notmatch "synth-metadata=PASS") {
            throw "Synth metadata marker missing"
          }
          if ($joined -notmatch "editor-no-reparent=PASS") {
            throw "Native no-reparent editor marker missing"
          }
          if ($joined -notmatch "editor-open=PASS") {
            throw "Cross-process editor open marker missing"
          }
          if ($joined -notmatch "direct-open-parent-ready=PASS") {
            throw "Direct editor parent readiness marker missing"
          }
          if ($joined -notmatch "editor-native-mouse=PASS") {
            throw "Native editor mouse marker missing"
          }
          if ($joined -notmatch "editor-native-drag=PASS") {
            throw "Native editor drag marker missing"
          }
          if ($joined -notmatch "editor-crash-cleanup=PASS") {
            throw "Editor crash cleanup marker missing"
          }
          if ($joined -notmatch "editor-crash-reopen=PASS") {
            throw "Editor crash reopen marker missing"
          }
          if ($joined -notmatch "editor-close=PASS") {
            throw "Cross-process editor close marker missing"
          }
          if ($joined -notmatch "host-runtime-context=PASS") {
            throw "Host runtime context marker missing"
          }
          if ($joined -notmatch "legacy-idle-proxy=PASS") {
            throw "Legacy idle proxy marker missing"
          }
          if ($joined -notmatch "host-capabilities=PASS") {
            throw "Host capability marker missing"
          }
          if ($joined -notmatch "host-callback-forwarding=PASS") {
            throw "Host callback forwarding marker missing"
          }
          if ($joined -notmatch "dynamic-io-change=PASS") {
            throw "Dynamic I/O change marker missing"
          }
          if ($joined -notmatch "editor-automation=PASS") {
            throw "Editor automation coherence marker missing"
          }
          if ($joined -notmatch "plugin-automation-no-echo=PASS") {
            throw "Plugin automation echo regression marker missing"
          }
          if ($joined -notmatch "gui-gesture-continuous-audio=PASS") {
            throw "GUI gesture continuous-audio regression marker missing"
          }
          if ($joined -notmatch "host-parameter-no-redundant-resync=PASS") {
            throw "Host parameter sparse-apply regression marker missing"
          }
          if ($joined -notmatch "rt-contention-nonblocking=PASS") {
            throw "Realtime contention nonblocking marker missing"
          }
          if ($joined -notmatch "synth-note-on=PASS") {
            throw "Synth note-on marker missing"
          }
          if ($joined -notmatch "realtime-thread-affinity=PASS") {
            throw "Realtime lifecycle thread-affinity marker missing"
          }
          if ($joined -notmatch "synth-note-off=PASS") {
            throw "Synth note-off marker missing"
          }
          if ($joined -notmatch "plugin-midi-out-capabilities=PASS") {
            throw "Plugin MIDI output capability marker missing"
          }
          if ($joined -notmatch "float-processing-contract=PASS") {
            throw "Float processing contract marker missing"
          }
          if ($joined -notmatch "start-process-idempotent=PASS") {
            throw "Start process idempotence marker missing"
          }
          if ($joined -notmatch "plugin-midi-out-note-on=PASS") {
            throw "Plugin to host MIDI note-on marker missing"
          }
          if ($joined -notmatch "plugin-midi-out-note-off=PASS") {
            throw "Plugin to host MIDI note-off marker missing"
          }
          if ($joined -notmatch "rt-callback-context=PASS") {
            throw "Realtime callback context marker missing"
          }
          if ($joined -notmatch "synth=PASS") {
            throw "Synth bridge marker missing"
          }

      - name: Run Pro-53-style GDI scaler harness
        timeout-minutes: 3
        shell: pwsh
        run: |
          $gdiHost = Resolve-Path "build-x64\tests\Release\PluginScalerVST2GdiProxyHost.exe"
          $proxy = Resolve-Path "build-x64\src\proxy\vst2\Release\PluginScalerVST2Proxy.dll"
          $helper = Resolve-Path "build-x86\src\helper\Release\PluginScalerHelper-x86.exe"
          $gdi = Resolve-Path "build-x86\tests\Release\MockVST2LegacyGdi.dll"
          $manifest = Join-Path $PWD "build-x86\MockVST2LegacyGdi.pluginscaler.txt"

          & $helper --write-vst2-manifest $gdi $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "Legacy GDI manifest generation failed with exit code $LASTEXITCODE"
          }

          $output = & $gdiHost $proxy $helper $gdi $manifest
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Legacy GDI harness failed with exit code $LASTEXITCODE"
          }

          $joined = ($output | Out-String)
          foreach ($marker in @(
            "gdi-scale-125=PASS",
            "gdi-scale-150=PASS",
            "gdi-scale-200=PASS",
            "gdi-cycle-125-3=PASS",
            "gdi-cycle-150-3=PASS",
            "gdi-cycle-200-3=PASS",
            "gdi-scaled-visual=PASS",
            "gdi-click-map=PASS",
            "gdi-drag-redraw=PASS",
            "gdi-outside-drag=PASS",
            "gdi-realtime-drag-125=PASS",
            "gdi-realtime-drag-150=PASS",
            "gdi-realtime-drag-200=PASS",
            "gdi-close=PASS",
            "gdi-harness=PASS"
          )) {
            if ($joined -notmatch [regex]::Escape($marker)) {
              throw "Legacy GDI marker missing: $marker"
            }
          }

      - name: Run x64 proxy from sidecar configuration
        timeout-minutes: 3
        shell: pwsh
        run: |
          $synthHost = Resolve-Path "build-x64\tests\Release\PluginScalerVST2SynthProxyHost.exe"
          $sourceProxy = Resolve-Path "build-x64\src\proxy\vst2\Release\PluginScalerVST2Proxy.dll"
          $sourceHelper = Resolve-Path "build-x86\src\helper\Release\PluginScalerHelper-x86.exe"
          $synth = Resolve-Path "build-x86\tests\Release\MockVST2Synth.dll"

          $testDir = Join-Path $PWD "sidecar-test"
          New-Item -ItemType Directory -Force $testDir | Out-Null

          $proxy = Join-Path $testDir "MockSynth-125A.dll"
          $helper = Join-Path $testDir "PluginScalerHelper-x86.exe"
          $manifest = Join-Path $testDir "MockSynth.pluginscaler.txt"
          $config = Join-Path $testDir "MockSynth-125A.pluginscaler.ini"

          Copy-Item $sourceProxy $proxy -Force
          Copy-Item $sourceHelper $helper -Force
          & $helper --write-vst2-manifest $synth $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "Sidecar manifest generation failed with exit code $LASTEXITCODE"
          }

          @"
          [PluginScaler]
          helper=PluginScalerHelper-x86.exe
          target=$synth
          manifest=MockSynth.pluginscaler.txt
          scale=100
          editor=Direct
          "@ | Set-Content -Path $config -Encoding Unicode

          $output = & $synthHost $proxy $helper $synth $manifest --sidecar
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Sidecar-configured proxy failed with exit code $LASTEXITCODE"
          }

          $joined = ($output | Out-String)
          foreach ($marker in @(
            "synth-metadata=PASS",
            "editor-no-reparent=PASS",
            "editor-native-mouse=PASS",
            "editor-native-drag=PASS",
            "editor-close=PASS",
            "legacy-idle-proxy=PASS",
            "host-capabilities=PASS",
            "host-callback-forwarding=PASS",
            "editor-automation=PASS",
            "rt-contention-nonblocking=PASS",
            "synth-note-on=PASS",
            "synth-note-off=PASS",
            "synth=PASS"
          )) {
            if ($joined -notmatch [regex]::Escape($marker)) {
              throw "Sidecar marker missing: $marker"
            }
          }

      - name: Verify wrapper setup script
        timeout-minutes: 3
        shell: pwsh
        run: |
          $synthHost = Resolve-Path "build-x64\tests\Release\PluginScalerVST2SynthProxyHost.exe"
          $sourceProxy = Resolve-Path "build-x64\src\proxy\vst2\Release\PluginScalerVST2Proxy.dll"
          $sourceHelper = Resolve-Path "build-x86\src\helper\Release\PluginScalerHelper-x86.exe"
          $synth = Resolve-Path "build-x86\tests\Release\MockVST2Synth.dll"
          $outDir = Join-Path $PWD "wrapper-script-test"

          & ".\tools\Create-VST2Wrapper.ps1" `
            -TargetDll $synth `
            -ProxyDll $sourceProxy `
            -HelperExe $sourceHelper `
            -OutputDir $outDir `
            -Scale 100 `
            -EditorMode Direct `
            -WrapperName "MockSynth-125A"

          if ($LASTEXITCODE -ne 0) {
            throw "Wrapper setup script failed with exit code $LASTEXITCODE"
          }

          $proxy = Join-Path $outDir "MockSynth-125A.dll"
          $helper = Join-Path $outDir "PluginScalerHelper-x86.exe"
          $manifest = Join-Path $outDir "MockSynth-125A.pluginscaler.txt"

          $output = & $synthHost $proxy $helper $synth $manifest --sidecar
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Generated wrapper failed with exit code $LASTEXITCODE"
          }

          $joined = ($output | Out-String)
          foreach ($marker in @(
            "synth-metadata=PASS",
            "editor-no-reparent=PASS",
            "editor-native-mouse=PASS",
            "editor-native-drag=PASS",
            "editor-close=PASS",
            "legacy-idle-proxy=PASS",
            "host-capabilities=PASS",
            "host-callback-forwarding=PASS",
            "editor-automation=PASS",
            "rt-contention-nonblocking=PASS",
            "synth-note-on=PASS",
            "synth-note-off=PASS",
            "synth=PASS"
          )) {
            if ($joined -notmatch [regex]::Escape($marker)) {
              throw "Generated wrapper marker missing: $marker"
            }
          }

      - name: Package real VST2 test kit
        shell: pwsh
        run: |
          $fieldTestScript = Get-Content "tools\Create-RealVST2-TestWrapper-GUI.ps1" -Raw
          [scriptblock]::Create($fieldTestScript) | Out-Null
          if ($fieldTestScript -notmatch 'Scale\s*=\s*100') {
            throw "Real VST2 field test must stay at 100% baseline scale"
          }
          if ($fieldTestScript -notmatch 'EditorMode\s*=\s*"Direct"') {
            throw "Real VST2 field test must use Direct editor mode"
          }
          if ($fieldTestScript -match 'EditorMode\s*=\s*"Gdi"') {
            throw "Real VST2 baseline must not force GDI mode"
          }

          $kit = Join-Path $PWD "PluginScaler-TestKit"
          New-Item -ItemType Directory -Force -Path $kit | Out-Null

          Copy-Item "build-x64\src\proxy\vst2\Release\PluginScalerVST2Proxy.dll" (Join-Path $kit "PluginScalerVST2Proxy.dll") -Force
          Copy-Item "build-x86\src\helper\Release\PluginScalerHelper-x86.exe" (Join-Path $kit "PluginScalerHelper-x86.exe") -Force
          Copy-Item "tools\Create-VST2Wrapper.ps1" (Join-Path $kit "Create-VST2Wrapper.ps1") -Force
          Copy-Item "tools\Create-RealVST2-TestWrapper-GUI.ps1" (Join-Path $kit "Create-RealVST2-TestWrapper-GUI.ps1") -Force
          Copy-Item "tools\START-REAL-VST2-TEST.vbs" (Join-Path $kit "START-REAL-VST2-TEST.vbs") -Force
          Copy-Item "docs\REAL-VST2-TEST.md" (Join-Path $kit "REAL-VST2-TEST.md") -Force

          foreach ($required in @(
            "PluginScalerVST2Proxy.dll",
            "PluginScalerHelper-x86.exe",
            "Create-VST2Wrapper.ps1",
            "Create-RealVST2-TestWrapper-GUI.ps1",
            "START-REAL-VST2-TEST.vbs",
            "REAL-VST2-TEST.md"
          )) {
            if (-not (Test-Path (Join-Path $kit $required) -PathType Leaf)) {
              throw "Real VST2 test kit file missing: $required"
            }
          }

          Write-Host "real-vst2-field-kit=PASS"

      - name: Upload real VST2 test kit
        uses: actions/upload-artifact@v4
        with:
          name: 125A-PluginScaler-RealVST2-TestKit
          path: PluginScaler-TestKit
          if-no-files-found: error
          retention-days: 14
