name: Windows Bootstrap

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Select-Object -ExpandProperty Name

      - name: Configure
        run: >
          cmake -S . -B build
          -A ${{ matrix.arch }}
          -DPLUGINSCALER_FETCH_VST3_SDK=ON
          -DPLUGINSCALER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
