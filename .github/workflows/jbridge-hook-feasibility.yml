name: jBridge native HWND hook feasibility
on:
  push:
    branches: [feature/jbridge-gui-scaler]
    paths:
      - 'src/jbridge_hook/**'
      - 'CMakeLists.txt'
      - '.github/workflows/jbridge-hook-feasibility.yml'
  workflow_dispatch:

jobs:
  hook:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure 32-bit hook probe
        shell: pwsh
        run: |
          cmake -S . -B build-hook-x86 -A Win32 -DPLUGINSCALER_FETCH_VST3_SDK=OFF -DPLUGINSCALER_BUILD_TESTS=OFF
      - name: Build only hook and cross-process mock
        shell: pwsh
        run: |
          cmake --build build-hook-x86 --config Release --target PluginScalerJBridgeCbtHook PluginScalerJBridgeHookSmoke PluginScalerNativeGdiScaleSmoke PluginScalerNativeScaleHook PluginScalerNativeScaleHookSmoke PluginScalerMockLegacyRenderer
      - name: Test two independent native 32-bit editor threads
        shell: pwsh
        run: |
          & "build-hook-x86/src/jbridge_hook/Release/PluginScalerJBridgeHookSmoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Cross-process HWND hook injection FAILED" }
      - name: Measure native GDI pixels and actual mouse drags at 150 and 200 percent
        shell: pwsh
        run: |
          & "build-hook-x86/src/jbridge_hook/Release/PluginScalerNativeGdiScaleSmoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "150/200 percent GDI rendering or native mouse gate FAILED" }
      - name: Test injected original GDI renderer and input (x86 150 and 200 percent)
        shell: pwsh
        run: |
          & "build-hook-x86/src/jbridge_hook/Release/PluginScalerNativeScaleHookSmoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Native injected GDI editor scale is NOT PROVEN" }
      - name: Attach then safely detach two already-open 32-bit GUI editors
        shell: pwsh
        run: |
          & "build-hook-x86/src/jbridge_hook/Release/PluginScalerNativeScaleHookSmoke.exe" --already-open
          if ($LASTEXITCODE -ne 0) { throw "Already-open native editor attach failed" }

      - name: Attach to original DIB-rendering 32-bit editors (Pro-53-style API)
        shell: pwsh
        run: |
          & "build-hook-x86/src/jbridge_hook/Release/PluginScalerNativeScaleHookSmoke.exe" --already-open --dib
          if ($LASTEXITCODE -ne 0) { throw "Real DIB rendering at 150/200 percent failed" }
